[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "self-healing-api-platform"
version = "0.1.0"
description = "Production-oriented Self-Healing API Reliability Platform with Intelligent User-Specific Caching"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # --- Data validation & settings ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # --- Redis ---
    "redis[hiredis]>=5.2.0",
    # --- HTTP client (health checks, external APIs) ---
    "httpx>=0.28.0",
    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    # --- Structured logging ---
    "structlog>=24.4.0",
    # --- Scheduling (monitoring worker) ---
    "apscheduler>=3.10.4",
    # --- Metrics ---
    "prometheus-client>=0.21.0",
    # --- OpenTelemetry tracing ---
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",          # also needed by TestClient
    "asgi-lifespan>=2.1.0",
    "anyio>=4.6.0",
    "factory-boy>=3.3.1",
    "faker>=30.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4.20240106",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations (key ones)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "ANN101",  # missing self annotation
    "ANN102",  # missing cls annotation
    "S101",    # use of assert (OK in tests)
    "B008",    # do not perform function calls in default args (FastAPI Depends pattern)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "ANN"]
"migrations/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]
