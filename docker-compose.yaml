services:
  postgres:
    image: postgres:16
    container_name: apixplore-postgres
    environment:
      POSTGRES_DB: apixplore
      POSTGRES_USER: apixplore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - apixplore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apixplore -d apixplore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apixplore-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - apixplore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: apixplore-backend:v1
    container_name: apixplore-backend
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+asyncpg://apixplore:${POSTGRES_PASSWORD}@postgres:5432/apixplore
      REDIS_URL: redis://redis:6379/0
      API_KEY: ""
      ALLOWED_DOMAINS: ""
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      DEVELOPMENT_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  apixplore_postgres_data:
  apixplore_redis_data:
